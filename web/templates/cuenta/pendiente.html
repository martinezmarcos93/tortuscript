<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificá tu correo · TortuScript</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tortuscript.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta centrado">
    <div class="mascota gran" aria-hidden="true">✉️</div>
    <h1>Verificá tu correo</h1>
    {% if mensaje %}
    <p class="texto-grande">{{ mensaje }}</p>
    {% else %}
    <p class="texto-grande">Enviamos un enlace de verificación a <strong>{{ email }}</strong>.</p>
    {% endif %}
    <p>Después de verificarlo, podés ingresar a TortuScript.</p>
    <form method="post" action="{{ url_for('cuenta.reenviar_verificacion') }}">
      <label for="email">Correo de la cuenta</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
      <button class="boton grande" type="submit">Reenviar enlace de verificación</button>
    </form>
    <p><a class="boton verde grande" href="{{ url_for('cuenta.ingresar') }}">Ir a ingresar</a></p>
  </section>
</main>
</body>
</html>
