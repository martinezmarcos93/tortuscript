<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eliminación de la cuenta · TortuScript</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tortuscript.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta centrado">
    <div class="mascota gran" aria-hidden="true">🐢</div>
    <h1>Recibimos tu pedido</h1>
    <p class="texto-grande" role="status">La cuenta se va a eliminar el {{ fecha }}.</p>
    <p>Cerramos todas las sesiones. Hasta esa fecha podés arrepentirte: ingresá de nuevo con tu correo y tu contraseña
      y el pedido se cancela, sin que se borre nada.</p>
    <p><a class="boton" href="{{ url_for('cuenta.ingresar') }}">Ir a ingresar</a></p>
  </section>
</main>
</body>
</html>
