<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificación · TortuScript</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tortuscript.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta centrado">
    {% if confirmar %}
      <div class="mascota gran" aria-hidden="true">✉️</div>
      <h1>Confirmar correo</h1>
      <p class="texto-grande">Para verificar la cuenta, confirmá que querés continuar.</p>
      <form method="post" action="{{ url_for('cuenta.confirmar_verificacion_email') }}">
        <input type="hidden" name="token" value="{{ token }}">
        <button class="boton verde grande" type="submit">Confirmar correo</button>
      </form>
    {% elif ok %}
      <div class="mascota gran" aria-hidden="true">✅</div>
      <h1>Correo verificado</h1>
      <p class="texto-grande">La cuenta ya puede ingresar a TortuScript.</p>
      <p><a class="boton verde grande" href="{{ url_for('cuenta.ingresar') }}">Ingresar</a></p>
    {% else %}
      <div class="mascota gran" aria-hidden="true">⚠️</div>
      <h1>Enlace no válido</h1>
      <p class="texto-grande">El enlace no es válido o ya expiró.</p>
      <p><a class="boton verde grande" href="{{ url_for('cuenta.ingresar') }}">Ir a ingresar</a></p>
    {% endif %}
  </section>
</main>
</body>
</html>
