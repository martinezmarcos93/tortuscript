<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elegí un perfil · TortuScript</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tortuscript.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta">
    <div class="centrado">
      <div class="mascota gran" aria-hidden="true">🐢</div>
      <h1>¿Quién programa hoy?</h1>
      <p class="texto-grande">Elegí un perfil educativo.</p>
    </div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <div class="lista-perfiles">
      {% for perfil in perfiles %}
      <form method="post" action="{{ url_for('cuenta.seleccionar_perfil') }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="perfil_id" value="{{ perfil.id }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <button class="boton grande" type="submit">{{ perfil.display_name }}</button>
      </form>
      {% else %}
      <p class="centrado">Todavía no hay perfiles. Creá el primero abajo.</p>
      {% endfor %}
    </div>
    {% if perfiles|length < max_perfiles %}
    <hr>
    <form method="post" action="{{ url_for('cuenta.crear_perfil') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="etiqueta" for="nombre">Nuevo perfil</label>
      <input class="campo" id="nombre" name="nombre" maxlength="30" autocomplete="off" required>
      <button class="boton violeta grande" type="submit">Crear perfil y entrar</button>
    </form>
    {% endif %}
    <form method="post" action="{{ url_for('cuenta.logout') }}" class="centrado">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="boton chico" type="submit">Cerrar sesión</button>
    </form>
  </section>
</main>
</body>
</html>
