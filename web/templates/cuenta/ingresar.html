<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · TortuScript</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/tortuscript.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tortu.css') }}">
</head>
<body>
<main id="contenido" class="columna-ancha pagina-error">
  <section class="tarjeta">
    <div class="centrado">
      <div class="mascota gran" aria-hidden="true">🐢</div>
      <h1>Ingresar a TortuScript</h1>
      <p class="texto-grande">Entrá con la cuenta del adulto responsable.</p>
    </div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('cuenta.login') }}">
      <input type="hidden" name="next" value="{{ next_url or '/' }}">
      <label class="etiqueta" for="email">Correo</label>
      <input class="campo" id="email" name="email" type="email" autocomplete="email" required>
      <label class="etiqueta" for="password">Contraseña</label>
      <input class="campo" id="password" name="password" type="password" autocomplete="current-password" required>
      <p><button class="boton verde grande" type="submit">Ingresar</button></p>
    </form>
    <p class="centrado"><a href="{{ url_for('cuenta.recuperar') }}">Olvidé mi contraseña</a></p>
    <p class="centrado"><a href="{{ url_for('cuenta.registrar') }}">Crear una cuenta adulta</a></p>
  </section>
</main>
</body>
</html>
